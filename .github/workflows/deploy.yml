name: Validate and deploy IMGTR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without uploading or deleting files'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: imgtr-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
      - name: Ensure production-only data stays outside Git
        run: |
          set -euo pipefail
          test ! -e includes/config.php
          test ! -d uploads
          test -f downloads/IMGTR-ShareX-Setup.bat
          test "$(find downloads -type f | wc -l)" -eq 1
          test ! -d logs
          test ! -d .well-known
          test -f index.php
          test -f .htaccess

  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.IMGTR_DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require FTPS credentials
        shell: bash
        env:
          FTP_HOST: ${{ secrets.IMGTR_FTP_HOST }}
          FTP_USER: ${{ secrets.IMGTR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.IMGTR_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD" || {
            echo '::error::Set IMGTR_FTP_HOST, IMGTR_FTP_USER and IMGTR_FTP_PASSWORD repository secrets'
            exit 1
          }
      - name: Publish changed website files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.IMGTR_FTP_HOST }}
          username: ${{ secrets.IMGTR_FTP_USER }}
          password: ${{ secrets.IMGTR_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./
          server-dir: ${{ vars.IMGTR_FTP_SERVER_DIR || './' }}
          state-name: .imgtr-deploy-state.json
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            .ftpquota
            .env
            .env.*
            **/.env
            **/.env.*
            includes/config.php
            **/includes/config.php
            logs/**
            **/logs/**
            cache/**
            **/cache/**
            uploads/**
            **/uploads/**
            downloads/**
            **/downloads/**
            .well-known/**
            **/.well-known/**
            tmp/**
            **/tmp/**
            temp/**
            **/temp/**
            storage/**
            **/storage/**
            sessions/**
            **/sessions/**
            **/*.sql
            **/*.sql.gz
            **/*.sqlite
            **/*.log
            **/error_log
            README.md
            DEPLOYMENT.md
            includes/config.example.php
            .imgtr-deploy-state.json

      - name: Deploy only the restored ShareX installer
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        shell: bash
        env:
          FTP_HOST: ${{ secrets.IMGTR_FTP_HOST }}
          FTP_USER: ${{ secrets.IMGTR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.IMGTR_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ vars.IMGTR_FTP_SERVER_DIR || './' }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          installer = Path("downloads/IMGTR-ShareX-Setup.bat").read_bytes()
          with FTP_TLS(context=ssl.create_default_context(), timeout=30) as ftp:
              ftp.connect(os.environ["FTP_HOST"], 21)
              ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])
              ftp.prot_p()
              ftp.cwd(os.environ["FTP_DIRECTORY"])
              try:
                  ftp.cwd("downloads")
              except error_perm as exc:
                  if not str(exc).startswith("550"):
                      raise
                  ftp.mkd("downloads")
                  ftp.cwd("downloads")
              with Path("downloads/IMGTR-ShareX-Setup.bat").open("rb") as file:
                  ftp.storbinary("STOR IMGTR-ShareX-Setup.bat", file)
              remote = bytearray()
              ftp.retrbinary("RETR IMGTR-ShareX-Setup.bat", remote.extend)
              if hashlib.sha256(installer).digest() != hashlib.sha256(remote).digest():
                  raise RuntimeError("ShareX installer checksum mismatch after upload")
              print("Verified ShareX installer in downloads/; other files untouched.")
          PY
