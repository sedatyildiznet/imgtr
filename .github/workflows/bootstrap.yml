name: Import sanitized IMGTR source archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand initial source and commit
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/imgtr-source.zip ]; then
            echo "No import archive present; skipping."
            exit 0
          fi
          unzip -q .bootstrap/imgtr-source.zip -d .
          test -f index.php
          test -f .github/workflows/deploy.yml
          test ! -e includes/config.php
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import sanitized IMGTR application source'
          git push origin HEAD:main
