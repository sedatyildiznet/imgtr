name: One-time production deploy IMGTR
# Retry 2: multipart overwrite enabled and detailed API errors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imgtr-one-time-live.yml'

permissions:
  contents: read

jobs:
  live:
    if: ${{ github.event.head_commit.message == 'Deploy IMGTR production once via cPanel API' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PHP
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
      - name: Deploy IMGTR application files via cPanel HTTPS API
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DEPLOY_DIR: ${{ vars.CPANEL_DEPLOY_DIR }}
          GIT_BASE_SHA: ''
          DRY_RUN: '0'
        run: |
          set -euo pipefail
          test -n "$CPANEL_HOST" && test -n "$CPANEL_USERNAME" && test -n "$CPANEL_API_TOKEN" && test -n "$CPANEL_DEPLOY_DIR" || {
            echo "::error::Missing cPanel deployment settings"
            exit 1
          }
          python3 .github/scripts/cpanel_deploy.py
